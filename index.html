<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#24527a">
<meta name="description" content="Mein Portfolio – alle Konten, Aktien und ETFs in Franken">
<title>Portfolio</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Portfolio">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div id="boot" class="boot">
  <div class="boot-logo">📊</div>
  <div class="boot-text">Portfolio wird geladen …</div>
</div>

<!-- Login -->
<div id="login" class="login hidden">
  <div class="login-card">
    <div class="login-logo">📊</div>
    <h1>Mein Portfolio</h1>
    <p class="muted" id="login-sub">Melde dich an, um dein Portfolio zu sehen.</p>
    <form id="login-form" autocomplete="on">
      <label>E-Mail
        <input type="email" id="login-email" required autocomplete="username" inputmode="email">
      </label>
      <label>Passwort
        <input type="password" id="login-password" required autocomplete="current-password" minlength="6">
      </label>
      <p class="error hidden" id="login-error"></p>
      <button class="btn btn-primary btn-block" type="submit" id="login-submit">Anmelden</button>
      <button class="btn btn-ghost btn-block" type="button" id="login-toggle">Noch kein Konto? Registrieren</button>
      <button class="btn btn-link btn-block" type="button" id="login-reset">Passwort vergessen</button>
    </form>
  </div>
</div>

<!-- App -->
<div id="app" class="app hidden">
  <header class="topbar">
    <button class="icon-btn" id="btn-back" title="Zurück" hidden>‹</button>
    <h1 class="topbar-title" id="topbar-title">Übersicht</h1>
    <div class="topbar-actions">
      <button class="icon-btn" id="btn-refresh" title="Kurse aktualisieren">🔄</button>
      <button class="icon-btn" id="btn-settings" title="Einstellungen">⚙️</button>
    </div>
  </header>
  <div id="demo-banner" class="demo-banner hidden">Demo-Modus – Daten nur in diesem Browser. Firebase einrichten: siehe README.</div>

  <main id="view" class="view"></main>

  <nav class="tabbar">
    <a href="#/uebersicht" class="tab" data-tab="uebersicht"><span>📊</span>Übersicht</a>
    <a href="#/positionen" class="tab" data-tab="positionen"><span>📋</span>Positionen</a>
    <a href="#/erfassen" class="tab" data-tab="erfassen"><span>➕</span>Erfassen</a>
    <a href="#/konten" class="tab" data-tab="konten"><span>🏦</span>Konten</a>
  </nav>
</div>

<div id="toast" class="toast hidden"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
